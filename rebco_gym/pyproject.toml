[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rebco-gym"
version = "0.1.0"
description = "Farama Gymnasium environments for REBCO tape quench protection and current redistribution"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "gymnasium>=0.29.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
train = [
    "stable-baselines3>=2.0",
    "torch>=2.0",
]
viz = [
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
include = ["rebco_gym*"]
