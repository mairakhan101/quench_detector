* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--surface);
  color: var(--ink);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.page { max-width: 1180px; margin: 0 auto; padding: 32px 24px 64px; }

header { margin-bottom: 32px; }
header h1 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 22px; font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--ink);
}
header p {
  color: var(--ink-2); font-size: 14px; margin-top: 6px;
  max-width: 70ch;
}
header .tag-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 500;
  padding: 3px 10px; border-radius: 4px;
  letter-spacing: 0.02em;
}
.tag-good { background: var(--tag-good-bg); color: var(--good); }
.tag-warn { background: var(--tag-warn-bg); color: var(--warn); }
.tag-crit { background: var(--tag-crit-bg); color: var(--crit); }

.summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 28px;
}
.summary-card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 8px;
  padding: 16px;
}
.summary-card .label {
  font-size: 11px; font-weight: 500;
  color: var(--ink-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 4px;
}
.summary-card .val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 24px; font-weight: 600;
  color: var(--ink);
}
.summary-card .sub {
  font-size: 12px; color: var(--ink-2); margin-top: 2px;
}

.conductor-section { margin-bottom: 36px; }
.conductor-header {
  display: flex; align-items: baseline; gap: 12px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.conductor-header h2 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px; font-weight: 600;
  color: var(--ink);
}
.conductor-header .band-label {
  font-size: 12px; color: var(--ink-muted);
}
.conductor-header .metrics {
  display: flex; gap: 16px; margin-left: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
}
.conductor-header .metric-item { color: var(--ink-2); }
.conductor-header .metric-item strong { font-weight: 600; color: var(--ink); }

.chart-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
@media (max-width: 700px) {
  .chart-row { grid-template-columns: 1fr; }
}

.chart-card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 8px;
  padding: 16px;
  position: relative;
}
.chart-card .chart-title {
  font-size: 12px; font-weight: 500;
  color: var(--ink-2);
  margin-bottom: 10px;
}
.chart-card canvas {
  width: 100%; height: 200px;
  display: block;
}

.legend-row {
  display: flex; gap: 14px; margin-top: 8px;
  font-size: 11px; color: var(--ink-2);
  flex-wrap: wrap;
}
.legend-item { display: flex; align-items: center; gap: 4px; }
.legend-swatch {
  width: 12px; height: 3px; border-radius: 1px; flex-shrink: 0;
}

.seq-table {
  margin-top: 12px;
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 12px;
}
.seq-table th {
  text-align: left;
  font-weight: 500;
  color: var(--ink-muted);
  padding: 6px 10px;
  border-bottom: 1px solid var(--grid);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.seq-table td {
  padding: 6px 10px;
  border-bottom: 1px solid var(--grid);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--ink);
}
.seq-table td:first-child {
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  color: var(--ink-2);
}
.seq-table .err-good { color: var(--good); }
.seq-table .err-warn { color: var(--warn); }
.seq-table .err-crit { color: var(--crit); }

.tooltip {
  position: fixed;
  pointer-events: none;
  background: var(--tooltip-bg);
  color: var(--tooltip-ink);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  padding: 6px 10px;
  border-radius: 5px;
  z-index: 100;
  opacity: 0;
  transition: opacity 0.12s;
  white-space: nowrap;
  line-height: 1.6;
}
.tooltip.show { opacity: 1; }

.note {
  font-size: 12px; color: var(--ink-muted);
  margin-top: 6px; font-style: italic;
}
</style>

const COND_ORDER = ['bi2223_nostab','bi2223_agstab','rebco_nostab','rebco_stab','rebco_fd1d'];
const cs = getComputedStyle(document.documentElement);
function cv(n) { return cs.getPropertyValue(n).trim(); }
function errClass(v) { return v < 0.01 ? 'good' : v < 0.1 ? 'warn' : 'crit'; }
function fmtPct(v) { return v < 0.001 ? (v*100).toFixed(3)+'%' : v < 0.01 ? (v*100).toFixed(2)+'%' : (v*100).toFixed(1)+'%'; }

function bestSpec(d) {
  let best = null, bestMed = Infinity;
  for (const [spec, pd] of Object.entries(d.point)) {
    const med = median(pd.rel_err);
    if (med < bestMed) { bestMed = med; best = spec; }
  }
  return best;
}
function median(arr) {
  const s = arr.filter(v => isFinite(v)).sort((a,b) => a - b);
  if (!s.length) return NaN;
  const m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2;
}
function p95(arr) {
  const s = arr.filter(v => isFinite(v)).sort((a,b) => a - b);
  if (!s.length) return NaN;
  return s[Math.min(Math.floor(s.length * 0.95), s.length - 1)];
}

// Summary cards
const sg = document.getElementById('summary-grid');
for (const key of COND_ORDER) {
  const d = DATA[key];
  const bp = bestSpec(d);
  const pd = d.point[bp];
  const med = median(pd.rel_err);
  const cls = errClass(med);
  const card = document.createElement('div');
  card.className = 'summary-card';
  card.innerHTML = `<div class="label">${d.label}</div><div class="val" style="color:var(--${cls})">${fmtPct(med)}</div><div class="sub">median I* rel err (${bp})</div>`;
  sg.appendChild(card);
}

// Conductor sections
const container = document.getElementById('conductors');
const tooltip = document.getElementById('tooltip');

for (const key of COND_ORDER) {
  const d = DATA[key];
  const bp = bestSpec(d);
  const specKeys = Object.keys(d.point).filter(s => s !== 'B');
  const sec = document.createElement('div');
  sec.className = 'conductor-section';

  const bpData = d.point[bp];
  const medErr = median(bpData.rel_err);
  const p95Err = p95(bpData.rel_err);

  sec.innerHTML = `
    <div class="conductor-header">
      <h2>${d.label}</h2>
      <span class="band-label">NL band ${d.nl_band[0]}–${d.nl_band[1]} K</span>
      <div class="metrics">
        <span class="metric-item">best: <strong>${bp}</strong></span>
        <span class="metric-item">med: <strong>${fmtPct(medErr)}</strong></span>
        <span class="metric-item">p95: <strong>${fmtPct(p95Err)}</strong></span>
      </div>
    </div>
    <div class="chart-row">
      <div class="chart-card">
        <div class="chart-title">I*(T₀) relative error vs operating temperature</div>
        <canvas id="err-${key}" width="600" height="200"></canvas>
        <div class="legend-row" id="leg-${key}"></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">I*(T₀) prediction vs analytic ground truth</div>
        <canvas id="curve-${key}" width="600" height="200"></canvas>
        <div class="legend-row">
          <span class="legend-item"><span class="legend-swatch" style="background:var(--ink-muted)"></span>analytic</span>
          <span class="legend-item"><span class="legend-swatch" style="background:var(--s1)"></span>${bp} surrogate</span>
        </div>
      </div>
    </div>
    <table class="seq-table">
      <thead><tr><th>Sequence model</th><th>I* med rel err</th><th>I* p95 rel err</th><th>T* MAE</th><th>NL band med</th><th>Breach acc</th></tr></thead>
      <tbody id="seqtb-${key}"></tbody>
    </table>
    ${key === 'rebco_fd1d' ? '<p class="note">FD1d surrogates evaluated against finite-difference solver ground truth (nx=50, binary search).</p>' : ''}
  `;
  container.appendChild(sec);

  // Build legend
  const legEl = document.getElementById(`leg-${key}`);
  const seriesColors = [cv('--s1'), cv('--s2'), cv('--s3')];
  specKeys.forEach((spec, i) => {
    const c = seriesColors[Math.min(i, seriesColors.length - 1)];
    legEl.innerHTML += `<span class="legend-item"><span class="legend-swatch" style="background:${c}"></span>${spec}${spec === bp ? ' (best)' : ''}</span>`;
  });

  // Seq table
  const seqTb = document.getElementById(`seqtb-${key}`);
  for (const [arch, sm] of Object.entries(d.seq)) {
    const mc = errClass(sm.istar_median_rel_err);
    const bc = errClass(sm.band_median_rel_err || 0);
    seqTb.innerHTML += `<tr>

}

// ── Canvas drawing ──────────────────────────────────────────────────
function drawCharts() {
  const s1 = cv('--s1'), s2 = cv('--s2'), s3 = cv('--s3');
  const ink = cv('--ink'), ink2 = cv('--ink-2'), muted = cv('--ink-muted');
  const gridC = cv('--grid'), baseC = cv('--baseline');
  const nlBand = cv('--nl-band'), nlStroke = cv('--nl-stroke');
  const surfaceC = cv('--card');
  const seriesColors = [s1, s2, s3];

  for (const key of COND_ORDER) {
    const d = DATA[key];
    const bp = bestSpec(d);
    const specKeys = Object.keys(d.point).filter(s => s !== 'B');

    // ── Error chart ──
    const errCanvas = document.getElementById(`err-${key}`);
    const dpr = window.devicePixelRatio || 1;
    const rect = errCanvas.getBoundingClientRect();
    errCanvas.width = rect.width * dpr;
    errCanvas.height = rect.height * dpr;
    const ctx = errCanvas.getContext('2d');
    ctx.scale(dpr, dpr);
    const W = rect.width, H = rect.height;
    const pad = { t: 10, r: 16, b: 32, l: 56 };
    const pw = W - pad.l - pad.r, ph = H - pad.t - pad.b;

    const allT0 = specKeys.flatMap(s => d.point[s].T0);
    const allErr = specKeys.flatMap(s => d.point[s].rel_err).filter(v => isFinite(v) && v > 0);
    const t0Min = Math.min(...allT0), t0Max = Math.max(...allT0);
    const errMin = Math.max(1e-6, Math.min(...allErr) * 0.5);
    const errMax = Math.min(10, Math.max(...allErr) * 2);
    const logMin = Math.log10(errMin), logMax = Math.log10(errMax);

    function xMap(t) { return pad.l + (t - t0Min) / (t0Max - t0Min) * pw; }
    function yMap(e) { return pad.t + (1 - (Math.log10(Math.max(e, errMin)) - logMin) / (logMax - logMin)) * ph; }

    // NL band
    const nlL = Math.max(pad.l, xMap(d.nl_band[0]));
    const nlR = Math.min(pad.l + pw, xMap(d.nl_band[1]));
    if (nlR > nlL) {
      ctx.fillStyle = nlBand;
      ctx.fillRect(nlL, pad.t, nlR - nlL, ph);
      ctx.strokeStyle = nlStroke;
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(nlL, pad.t); ctx.lineTo(nlL, pad.t + ph); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(nlR, pad.t); ctx.lineTo(nlR, pad.t + ph); ctx.stroke();
      ctx.setLineDash([]);
    }

    // Grid
    ctx.strokeStyle = gridC; ctx.lineWidth = 1;
    const logTicks = [];
    for (let p = Math.ceil(logMin); p <= Math.floor(logMax); p++) logTicks.push(p);
    if (!logTicks.length) { for (let p = Math.floor(logMin); p <= Math.ceil(logMax); p++) logTicks.push(p); }
    for (const p of logTicks) {
      const y = yMap(Math.pow(10, p));
      ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(pad.l + pw, y); ctx.stroke();
    }

    // Baseline
    ctx.strokeStyle = baseC; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad.l, pad.t + ph); ctx.lineTo(pad.l + pw, pad.t + ph); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pad.l, pad.t); ctx.lineTo(pad.l, pad.t + ph); ctx.stroke();

    // Y axis labels
    ctx.fillStyle = muted; ctx.font = '500 10px "JetBrains Mono", monospace'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for (const p of logTicks) {
      const y = yMap(Math.pow(10, p));
      const v = Math.pow(10, p);
      ctx.fillText(v >= 0.01 ? (v*100).toFixed(0)+'%' : (v*100).toFixed(1)+'%', pad.l - 6, y);
    }

    // X axis
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const xSteps = pw > 400 ? 6 : 4;
    for (let i = 0; i <= xSteps; i++) {
      const t = t0Min + (t0Max - t0Min) * i / xSteps;
      ctx.fillText(t.toFixed(1), xMap(t), pad.t + ph + 6);
    }
    ctx.fillText('T₀ [K]', pad.l + pw / 2, pad.t + ph + 18);

    // Data points
    specKeys.forEach((spec, si) => {
      const pd = d.point[spec];
      const color = seriesColors[Math.min(si, seriesColors.length - 1)];
      const r = spec === bp ? 4 : 3;
      ctx.fillStyle = color;
      for (let i = 0; i < pd.T0.length; i++) {
        const e = pd.rel_err[i];
        if (!isFinite(e) || e <= 0) continue;
        const x = xMap(pd.T0[i]), y = yMap(e);
        if (y < pad.t || y > pad.t + ph) continue;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
        // Surface ring for best spec
        if (spec === bp) {
          ctx.strokeStyle = surfaceC; ctx.lineWidth = 2;
          ctx.stroke();
          ctx.strokeStyle = 'transparent';
        }
      }
    });

    // Hover
    errCanvas.addEventListener('pointermove', (ev) => {
      const br = errCanvas.getBoundingClientRect();
      const mx = ev.clientX - br.left, my = ev.clientY - br.top;
      let closest = null, closestDist = 24;
      for (const spec of specKeys) {
        const pd = d.point[spec];
        for (let i = 0; i < pd.T0.length; i++) {
          const e = pd.rel_err[i];
          if (!isFinite(e) || e <= 0) continue;
          const x = xMap(pd.T0[i]), y = yMap(e);
          const dist = Math.hypot(mx - x, my - y);
          if (dist < closestDist) { closestDist = dist; closest = { spec, T0: pd.T0[i], err: e }; }
        }
      }
      if (closest) {
        tooltip.className = 'tooltip show';
        tooltip.textContent = `${closest.spec}  T₀=${closest.T0.toFixed(2)} K  err=${fmtPct(closest.err)}`;
        tooltip.style.left = (ev.clientX + 12) + 'px';
        tooltip.style.top = (ev.clientY - 28) + 'px';
      } else { tooltip.className = 'tooltip'; }
    });
    errCanvas.addEventListener('pointerleave', () => { tooltip.className = 'tooltip'; });

    // ── I*(T0) curve chart ──
    const curveCanvas = document.getElementById(`curve-${key}`);
    const rect2 = curveCanvas.getBoundingClientRect();
    curveCanvas.width = rect2.width * dpr;
    curveCanvas.height = rect2.height * dpr;
    const ctx2 = curveCanvas.getContext('2d');
    ctx2.scale(dpr, dpr);
    const W2 = rect2.width, H2 = rect2.height;
    const pad2 = { t: 10, r: 16, b: 32, l: 56 };
    const pw2 = W2 - pad2.l - pad2.r, ph2 = H2 - pad2.t - pad2.b;

    const Ivals = d.Istar.filter(v => v != null);
    const bpPreds = d.point[bp].Istar_pred || d.point[bp].rel_err.map((e, i) => {
      const idx = d.point[bp].T0.indexOf ? i : i;
      return null;
    });
    const allI = [...Ivals];
    if (d.point[bp].Istar_pred) allI.push(...d.point[bp].Istar_pred);
    const Imin = Math.min(...allI) * 0.95, Imax = Math.max(...allI) * 1.02;

    const T0g = d.point[bp].T0;
    const tMin2 = Math.min(...T0g), tMax2 = Math.max(...T0g);

    function xMap2(t) { return pad2.l + (t - tMin2) / (tMax2 - tMin2) * pw2; }
    function yMap2(I) { return pad2.t + (1 - (I - Imin) / (Imax - Imin)) * ph2; }

    // NL band
    const nlL2 = Math.max(pad2.l, xMap2(d.nl_band[0]));
    const nlR2 = Math.min(pad2.l + pw2, xMap2(d.nl_band[1]));
    if (nlR2 > nlL2) {
      ctx2.fillStyle = nlBand;
      ctx2.fillRect(nlL2, pad2.t, nlR2 - nlL2, ph2);
      ctx2.strokeStyle = nlStroke;
      ctx2.lineWidth = 1;
      ctx2.setLineDash([3, 3]);
      ctx2.beginPath(); ctx2.moveTo(nlL2, pad2.t); ctx2.lineTo(nlL2, pad2.t + ph2); ctx2.stroke();
      ctx2.beginPath(); ctx2.moveTo(nlR2, pad2.t); ctx2.lineTo(nlR2, pad2.t + ph2); ctx2.stroke();
      ctx2.setLineDash([]);
    }

    // Grid
    ctx2.strokeStyle = gridC; ctx2.lineWidth = 1;
    const Isteps = 5;
    for (let i = 0; i <= Isteps; i++) {
      const Iv = Imin + (Imax - Imin) * i / Isteps;
      const y = yMap2(Iv);
      ctx2.beginPath(); ctx2.moveTo(pad2.l, y); ctx2.lineTo(pad2.l + pw2, y); ctx2.stroke();
    }
    ctx2.strokeStyle = baseC; ctx2.lineWidth = 1;
    ctx2.beginPath(); ctx2.moveTo(pad2.l, pad2.t + ph2); ctx2.lineTo(pad2.l + pw2, pad2.t + ph2); ctx2.stroke();
    ctx2.beginPath(); ctx2.moveTo(pad2.l, pad2.t); ctx2.lineTo(pad2.l, pad2.t + ph2); ctx2.stroke();

    // Y labels
    ctx2.fillStyle = muted; ctx2.font = '500 10px "JetBrains Mono", monospace'; ctx2.textAlign = 'right'; ctx2.textBaseline = 'middle';
    for (let i = 0; i <= Isteps; i++) {
      const Iv = Imin + (Imax - Imin) * i / Isteps;
      ctx2.fillText(Iv.toFixed(0), pad2.l - 6, yMap2(Iv));
    }
    // X labels
    ctx2.textAlign = 'center'; ctx2.textBaseline = 'top';
    for (let i = 0; i <= xSteps; i++) {
      const t = tMin2 + (tMax2 - tMin2) * i / xSteps;
      ctx2.fillText(t.toFixed(1), xMap2(t), pad2.t + ph2 + 6);
    }
    ctx2.fillText('T₀ [K]', pad2.l + pw2 / 2, pad2.t + ph2 + 18);

    // Analytic line
    ctx2.strokeStyle = muted; ctx2.lineWidth = 2; ctx2.setLineDash([]);
    ctx2.beginPath();
    let started = false;
    for (let i = 0; i < T0g.length; i++) {
      const Ia = d.Istar[i] != null ? d.Istar[i] : null;
      if (Ia == null) continue;
      const x = xMap2(T0g[i]), y = yMap2(Ia);
      if (!started) { ctx2.moveTo(x, y); started = true; } else ctx2.lineTo(x, y);
    }
    ctx2.stroke();

    // Surrogate prediction
    if (d.point[bp].Istar_pred) {
      ctx2.strokeStyle = s1; ctx2.lineWidth = 2;
      ctx2.beginPath();
      started = false;
      for (let i = 0; i < T0g.length; i++) {
        const Ip = d.point[bp].Istar_pred[i];
        if (Ip == null || !isFinite(Ip)) continue;
        const x = xMap2(T0g[i]), y = yMap2(Ip);
        if (!started) { ctx2.moveTo(x, y); started = true; } else ctx2.lineTo(x, y);
      }
      ctx2.stroke();

      // Error fill
      ctx2.fillStyle = s1.replace(')', ',0.1)').replace('rgb', 'rgba');
      ctx2.beginPath();
      for (let i = 0; i < T0g.length; i++) {
        const Ia = d.Istar[i], Ip = d.point[bp].Istar_pred[i];
        if (Ia == null || Ip == null) continue;
        ctx2.lineTo(xMap2(T0g[i]), yMap2(Ia));
      }
      for (let i = T0g.length - 1; i >= 0; i--) {
        const Ip = d.point[bp].Istar_pred[i];
        if (Ip == null || !isFinite(Ip)) continue;
        ctx2.lineTo(xMap2(T0g[i]), yMap2(Ip));
      }
      ctx2.closePath(); ctx2.fill();
    }

    // Hover on curve chart
    curveCanvas.addEventListener('pointermove', (ev) => {
      const br = curveCanvas.getBoundingClientRect();
      const mx = ev.clientX - br.left;
      const t = tMin2 + (mx - pad2.l) / pw2 * (tMax2 - tMin2);
      let closestIdx = 0, closestDist = Infinity;
      for (let i = 0; i < T0g.length; i++) {
        const dist = Math.abs(T0g[i] - t);
        if (dist < closestDist) { closestDist = dist; closestIdx = i; }
      }
      const Ia = d.Istar[closestIdx];
      const Ip = d.point[bp].Istar_pred ? d.point[bp].Istar_pred[closestIdx] : null;
      if (Ia != null) {
        tooltip.className = 'tooltip show';
        let txt = `T₀=${T0g[closestIdx].toFixed(2)} K  I*=${Ia.toFixed(1)} A`;
        if (Ip != null) txt += `  pred=${Ip.toFixed(1)} A`;
        tooltip.textContent = txt;
        tooltip.style.left = (ev.clientX + 12) + 'px';
        tooltip.style.top = (ev.clientY - 28) + 'px';
      } else { tooltip.className = 'tooltip'; }
    });
    curveCanvas.addEventListener('pointerleave', () => { tooltip.className = 'tooltip'; });
  }
}

drawCharts();
window.addEventListener('resize', drawCharts);

const mql = window.matchMedia('(prefers-color-scheme: dark)');
mql.addEventListener('change', () => setTimeout(drawCharts, 50));
new MutationObserver(() => setTimeout(drawCharts, 50)).observe(
  document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }
);
</script>
